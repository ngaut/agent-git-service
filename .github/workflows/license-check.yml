name: license-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          cache-dependency-path: go.sum

      - name: Check root Go module dependency licenses
        run: python3 scripts/license_check.py --report artifacts/dependency-licenses.tsv
