name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_history:
        description: "Also scan full git history"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          cache: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/gitleaks-bin"
          export GOBIN
          mkdir -p "$GOBIN"
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          "$GOBIN/gitleaks" version

      - name: Scan checked-out files
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks-bin/gitleaks" scripts/secret_scan.sh --worktree-only

      - name: Scan full git history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_history }}
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks-bin/gitleaks" scripts/secret_scan.sh --history-only
